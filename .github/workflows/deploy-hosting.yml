name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBCDDFuGR2TZjqBDROPQ-m1Yazf0yWp5fA
          VITE_FIREBASE_AUTH_DOMAIN: free-lunch-85447.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: free-lunch-85447
          VITE_FIREBASE_STORAGE_BUCKET: free-lunch-85447.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "390998323286"
          VITE_FIREBASE_APP_ID: "1:390998323286:web:a293c50c66f6cde7dccbf7"
          VITE_APP_ENV: production
          VITE_USE_EMULATORS: "false"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: free-lunch-85447
