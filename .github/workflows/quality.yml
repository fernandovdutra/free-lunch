name: Quality

on:
  pull_request:
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install function deps
        working-directory: functions
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Create test env file
        run: cp .env.test.example .env.test

      - name: Typecheck
        run: npm run typecheck

      # Root typecheck/lint only cover src/; compile the functions so backend
      # type errors fail the gate instead of surfacing during deploy.
      - name: Typecheck functions
        working-directory: functions
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test && cd functions && npx vitest run

  categorization-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: functions
      - run: npx firebase emulators:exec --project demo-free-lunch-test --only firestore 'npm run test:emulator'

  categorization-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: npx playwright install --with-deps chromium
      - name: Mobile categorization flow
        run: |
          cp .env.test.example .env.local
          sed -i 's/your-project-id/demo-free-lunch-test/g' .env.local
          npx firebase emulators:exec --project demo-free-lunch-test --only auth,firestore,functions 'node scripts/seed-emulator.mjs && npx playwright test e2e/categorization.spec.ts'
        env:
          FIREBASE_PROJECT_ID: demo-free-lunch-test
          VITE_FIREBASE_PROJECT_ID: demo-free-lunch-test
